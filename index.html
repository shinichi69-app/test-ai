<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Tester & Personal Assistant</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f3f4f6;
            --card-bg: #ffffff;
            --text: #1f2937;
            --border: #e5e7eb;
            --assistant-bg: #f0fdf4;
            --user-bg: #eff6ff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        body { background-color: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }

        .container {
            width: 100%; max-width: 900px; background: var(--card-bg);
            border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            overflow: hidden; display: flex; flex-direction: column; height: 90vh;
        }

        /* Header */
        header {
            background: var(--primary); color: white; padding: 20px;
            text-align: center; font-size: 1.2rem; font-weight: bold;
            display: flex; justify-content: space-between; align-items: center;
        }
        header span { font-size: 0.8rem; opacity: 0.8; font-weight: normal; }

        /* Search & Config Area */
        .config-area { padding: 20px; border-bottom: 1px solid var(--border); background: #fafafa; }
        
        .input-group { display: flex; gap: 10px; margin-bottom: 10px; }
        
        select, input[type="text"], input[type="password"] {
            padding: 10px 15px; border: 1px solid var(--border); border-radius: 8px;
            font-size: 1rem; outline: none; transition: border 0.3s;
        }
        select:focus, input:focus { border-color: var(--primary); }
        select { width: 120px; font-weight: bold; }
        input[type="text"] { flex: 1; }

        button {
            background: var(--primary); color: white; border: none;
            padding: 10px 20px; border-radius: 8px; font-size: 1rem;
            cursor: pointer; font-weight: bold; transition: background 0.3s;
            white-space: nowrap;
        }
        button:hover { background: var(--primary-hover); }
        button:disabled { background: #9ca3af; cursor: not-allowed; }

        .options-row { display: flex; gap: 10px; flex-wrap: wrap; }
        .options-row textarea {
            flex: 1; min-width: 250px; height: 60px; padding: 10px;
            border: 1px solid var(--border); border-radius: 8px; resize: none; font-size: 0.9rem;
        }

        /* Chat / Result Display Area */
        .chat-area {
            flex: 1; overflow-y: auto; padding: 20px;
            display: flex; flex-direction: column; gap: 15px;
            background: #fcfcfc;
        }

        .message {
            max-width: 85%; padding: 15px; border-radius: 12px;
            line-height: 1.5; font-size: 0.95rem; word-wrap: break-word;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .message.user {
            align-self: flex-end; background: var(--user-bg);
            border: 1px solid #bfdbfe; border-bottom-right-radius: 2px;
        }

        .message.assistant {
            align-self: flex-start; background: var(--assistant-bg);
            border: 1px solid #bbf7d0; border-bottom-left-radius: 2px;
        }

        .message.error {
            align-self: flex-start; background: #fef2f2;
            border: 1px solid #fecaca; color: #b91c1c;
        }

        .message-header { font-size: 0.75rem; font-weight: bold; margin-bottom: 5px; color: #6b7280; text-transform: uppercase; }
        
        pre {
            background: #1e1e1e; color: #d4d4d4; padding: 15px;
            border-radius: 8px; overflow-x: auto; font-size: 0.85rem; margin-top: 10px;
        }

        .typing-indicator { display: flex; gap: 5px; padding: 10px; }
        .typing-indicator span { width: 8px; height: 8px; background: #9ca3af; border-radius: 50%; animation: bounce 1.4s infinite ease-in-out both; }
        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }

        /* Responsive */
        @media (max-width: 600px) {
            .input-group { flex-direction: column; }
            select { width: 100%; }
            .options-row { flex-direction: column; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div>🤖 API Tester & Assistant</div>
        <span>ผู้ช่วยส่วนตัวประจำเว็บไซต์</span>
    </header>

    <!-- ส่วนตั้งค่าและค้นหา -->
    <div class="config-area">
        <div class="input-group">
            <select id="method">
                <option value="GET">GET</option>
                <option value="POST">POST</option>
                <option value="PUT">PUT</option>
                <option value="DELETE">DELETE</option>
            </select>
            <input type="text" id="url" placeholder="กรอก URL ของ API เช่น https://jsonplaceholder.typicode.com/posts/1" value="https://jsonplaceholder.typicode.com/posts/1">
            <button id="sendBtn" onclick="sendRequest()">ส่งคำสั่ง (Send)</button>
        </div>
        
        <div class="options-row">
            <textarea id="headers" placeholder="Headers (JSON format)&#10;ตัวอย่าง:&#10;{&#10;  &quot;Authorization&quot;: &quot;Bearer token...&quot;&#10;}"></textarea>
            <textarea id="body" placeholder="Body (JSON format สำหรับ POST/PUT)&#10;ตัวอย่าง:&#10;{&#10;  &quot;title&quot;: &quot;foo&quot;,&#10;  &quot;body&quot;: &quot;bar&quot;&#10;}"></textarea>
        </div>
    </div>

    <!-- ส่วนแสดงผลแบบแชท -->
    <div class="chat-area" id="chatArea">
        <div class="message assistant">
            <div class="message-header">Assistant</div>
            สวัสดีครับ! ผมเป็นผู้ช่วยทดสอบ API ประจำเว็บไซต์ของคุณ<br><br>
            👉 <strong>วิธีใช้:</strong> เลือก Method, กรอก URL, ใส่ Headers/Body (ถ้ามี) แล้วกด "ส่งคำสั่ง"<br>
            💡 <em>ลองทดสอบด้วย URL ตัวอย่างที่เตรียมไว้ให้ได้เลย!</em>
        </div>
    </div>
</div>

<script>
    const chatArea = document.getElementById('chatArea');
    const urlInput = document.getElementById('url');
    const methodSelect = document.getElementById('method');
    const headersInput = document.getElementById('headers');
    const bodyInput = document.getElementById('body');
    const sendBtn = document.getElementById('sendBtn');

    // ฟังก์ชันเพิ่มข้อความลงแชท
    function addMessage(content, type, isJson = false) {
        const msgDiv = document.createElement('div');
        msgDiv.classList.add('message', type);

        const header = document.createElement('div');
        header.classList.add('message-header');
        header.innerText = type === 'user' ? 'คุณ (Request)' : type === 'assistant' ? 'Assistant (Response)' : 'Error';
        
        msgDiv.appendChild(header);

        if (isJson) {
            const pre = document.createElement('pre');
            pre.textContent = content;
            msgDiv.appendChild(pre);
        } else {
            const textNode = document.createElement('div');
            textNode.innerHTML = content;
            msgDiv.appendChild(textNode);
        }

        chatArea.appendChild(msgDiv);
        chatArea.scrollTop = chatArea.scrollHeight;
        return msgDiv;
    }

    // แสดง Loading
    function showTyping() {
        const msgDiv = document.createElement('div');
        msgDiv.classList.add('message', 'assistant');
        msgDiv.id = 'typingIndicator';
        msgDiv.innerHTML = `
            <div class="message-header">Assistant กำลังประมวลผล...</div>
            <div class="typing-indicator"><span></span><span></span><span></span></div>
        `;
        chatArea.appendChild(msgDiv);
        chatArea.scrollTop = chatArea.scrollHeight;
    }

    function hideTyping() {
        const typing = document.getElementById('typingIndicator');
        if (typing) typing.remove();
    }

    // ฟังก์ชันหลักในการเรียก API
    async function sendRequest() {
        const url = urlInput.value.trim();
        const method = methodSelect.value;
        const headersText = headersInput.value.trim();
        const bodyText = bodyInput.value.trim();

        if (!url) {
            addMessage('กรุณากรอก URL ก่อนทำการทดสอบครับ', 'error');
            return;
        }

        // สรุปสิ่งที่ผู้ใช้ส่ง (User Message)
        let userSummary = `<strong>${method}</strong> ${url}`;
        addMessage(userSummary, 'user');

        // เตรียม Options สำหรับ Fetch
        const options = {
            method: method,
            headers: { 'Content-Type': 'application/json' }
        };

        // Parse Headers
        if (headersText) {
            try {
                const customHeaders = JSON.parse(headersText);
                options.headers = { ...options.headers, ...customHeaders };
            } catch (e) {
                addMessage('รูปแบบ Headers ไม่ถูกต้อง กรุณาใช้ JSON Format', 'error');
                return;
            }
        }

        // Parse Body
        if ((method === 'POST' || method === 'PUT') && bodyText) {
            try {
                JSON.parse(bodyText); // Validate JSON
                options.body = bodyText;
            } catch (e) {
                addMessage('รูปแบบ Body ไม่ถูกต้อง กรุณาใช้ JSON Format', 'error');
                return;
            }
        }

        // เริ่มเรียก API
        sendBtn.disabled = true;
        showTyping();

        const startTime = performance.now();

        try {
            const response = await fetch(url, options);
            const endTime = performance.now();
            const duration = ((endTime - startTime) / 1000).toFixed(2);
            
            let responseBody = "";
            const contentType = response.headers.get("content-type");

            if (contentType && contentType.includes("application/json")) {
                const jsonData = await response.json();
                responseBody = JSON.stringify(jsonData, null, 2);
            } else {
                responseBody = await response.text();
            }

            hideTyping();

            // สร้างข้อความตอบกลับจาก Assistant
            let statusColor = response.ok ? '#16a34a' : '#dc2626';
            let summary = `
                <strong>Status:</strong> <span style="color:${statusColor}; font-weight:bold;">${response.status} ${response.statusText}</span><br>
                <strong>Time:</strong> ${duration} วินาที
            `;
            
            const msg = addMessage(summary, 'assistant');
            
            // ถ้ามีข้อมูล ให้แสดงในรูปแบบ JSON/Text block
            if (responseBody) {
                const pre = document.createElement('pre');
                pre.textContent = responseBody;
                msg.appendChild(pre);
            }

        } catch (error) {
            hideTyping();
            addMessage(`ไม่สามารถเชื่อมต่อ API ได้: <br><strong>${error.message}</strong><br><br><em>สาเหตุที่เป็นไปได้: CORS Policy, URL ผิดพลาด, หรือไม่มีอินเทอร์เน็ต</em>`, 'error');
        } finally {
            sendBtn.disabled = false;
        }
    }

    // รองรับการกด Enter ในช่อง URL
    urlInput.addEventListener('keypress', function (e) {
        if (e.key === 'Enter') sendRequest();
    });
</script>

</body>
</html>
