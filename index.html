<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Search Pro — Dark Theme</title>
<style>
  :root{
    --bg:#0b0d12; --panel:#141821; --panel-2:#1b202b; --panel-3:#222838;
    --border:#262c3a; --text:#e6e9f0; --muted:#8b93a7;
    --accent:#6d8cff; --accent-2:#38d39f; --danger:#ff6b6b; --warn:#ffb454;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh;
    background:
      radial-gradient(900px 500px at 15% -10%, #1a2340 0%, transparent 60%),
      radial-gradient(800px 500px at 90% 0%, #14322b 0%, transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:"Segoe UI","Noto Sans Thai",system-ui,-apple-system,sans-serif;
    padding:28px 16px 60px;
  }
  .wrap{max-width:1180px;margin:0 auto;}
  header{text-align:center;margin-bottom:24px;}
  header h1{margin:0 0 6px;font-size:32px;
    background:linear-gradient(90deg,var(--accent),var(--accent-2));
    -webkit-background-clip:text;background-clip:text;color:transparent;}
  header p{margin:0;color:var(--muted);font-size:14px;}
  .layout{display:grid;grid-template-columns:1fr 300px;gap:18px;align-items:start;}
  @media(max-width:900px){.layout{grid-template-columns:1fr;}}
  .card{background:var(--panel);border:1px solid var(--border);
    border-radius:var(--radius);padding:18px;margin-bottom:18px;
    box-shadow:0 10px 30px rgba(0,0,0,.35);}
  .card h2{margin:0 0 14px;font-size:12px;color:var(--muted);
    letter-spacing:.8px;text-transform:uppercase;
    display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .row{display:flex;gap:10px;flex-wrap:wrap;}
  .row>*{flex:1;min-width:140px;}
  label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;}
  input,select,textarea{width:100%;padding:11px 13px;background:var(--panel-2);
    border:1px solid var(--border);border-radius:10px;color:var(--text);
    font-size:15px;font-family:inherit;outline:none;transition:.2s;}
  input:focus,select:focus{border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(109,140,255,.18);}
  input[type=range]{padding:0;height:6px;-webkit-appearance:none;
    background:var(--panel-3);border:none;border-radius:99px;cursor:pointer;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;
    width:16px;height:16px;border-radius:50%;background:var(--accent);cursor:pointer;}
  button{padding:11px 18px;border:none;border-radius:10px;
    background:linear-gradient(135deg,var(--accent),#8a6dff);color:#fff;
    font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;
    transition:transform .12s,opacity .2s;white-space:nowrap;}
  button:hover{transform:translateY(-1px);}
  button:disabled{opacity:.45;cursor:not-allowed;transform:none;}
  button.ghost{background:var(--panel-2);border:1px solid var(--border);color:var(--muted);}
  button.ghost:hover{color:var(--text);border-color:var(--accent);}
  button.sm{padding:6px 11px;font-size:12px;}
  .search-bar{display:flex;gap:10px;}
  .search-bar input{flex:1;padding:15px 18px;font-size:16px;}
  #status{font-size:13px;color:var(--muted);min-height:20px;margin-top:10px;}
  #status.err{color:var(--danger);} #status.ok{color:var(--accent-2);}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
  .chip{padding:7px 13px;background:var(--panel-2);border:1px solid var(--border);
    border-radius:999px;font-size:13px;color:var(--muted);cursor:pointer;transition:.2s;}
  .chip:hover{border-color:var(--accent);color:var(--text);}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;
    background:var(--accent-2);margin-right:7px;animation:pulse 1s infinite;}
  @keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
  /* ===== Markdown ===== */
  #result{line-height:1.8;font-size:15px;min-height:60px;overflow-wrap:anywhere;}
  #result:empty::before{content:"ผลลัพธ์จะแสดงที่นี่...";color:var(--muted);}
  #result h1,#result h2,#result h3{color:#fff;margin:18px 0 8px;line-height:1.4;}
  #result h1{font-size:21px;} #result h2{font-size:18px;} #result h3{font-size:16px;}
  #result p{margin:9px 0;}
  #result ul,#result ol{margin:8px 0;padding-left:22px;}
  #result li{margin:4px 0;}
  #result strong{color:#fff;}
  #result a{color:var(--accent);}
  #result blockquote{margin:10px 0;padding:8px 14px;border-left:3px solid var(--accent);
    background:var(--panel-2);border-radius:0 8px 8px 0;color:var(--muted);}
  #result code{background:var(--panel-3);padding:2px 6px;border-radius:5px;
    font-family:Consolas,Monaco,monospace;font-size:13.5px;color:var(--accent-2);}
  #result pre{position:relative;background:#0d1117;border:1px solid var(--border);
    border-radius:10px;padding:14px;overflow-x:auto;margin:12px 0;}
  #result pre code{background:none;padding:0;color:#c9d1d9;font-size:13px;line-height:1.6;}
  #result pre .copy{position:absolute;top:8px;right:8px;padding:4px 9px;font-size:11px;
    background:var(--panel-3);border:1px solid var(--border);color:var(--muted);border-radius:6px;}
  #result table{width:100%;border-collapse:collapse;margin:12px 0;font-size:14px;}
  #result th,#result td{border:1px solid var(--border);padding:8px 11px;text-align:left;}
  #result th{background:var(--panel-2);color:#fff;}
  #result hr{border:none;border-top:1px solid var(--border);margin:16px 0;}
  /* ===== History ===== */
  .hist-item{padding:10px 12px;background:var(--panel-2);border:1px solid var(--border);
    border-radius:9px;margin-bottom:8px;cursor:pointer;transition:.2s;
    display:flex;justify-content:space-between;gap:8px;align-items:flex-start;}
  .hist-item:hover{border-color:var(--accent);}
  .hist-q{font-size:13px;line-height:1.45;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .hist-t{font-size:11px;color:var(--muted);margin-top:3px;}
  .hist-del{background:none;border:none;color:var(--muted);font-size:16px;
    padding:0 4px;cursor:pointer;line-height:1;}
  .hist-del:hover{color:var(--danger);}
  .empty{color:var(--muted);font-size:13px;text-align:center;padding:18px 0;}
  .meta{display:flex;gap:14px;font-size:12px;color:var(--muted);
    margin-top:12px;padding-top:12px;border-top:1px solid var(--border);flex-wrap:wrap;}
  .toggle{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);cursor:pointer;}
  .toggle input{width:auto;}
  details summary{cursor:pointer;color:var(--muted);font-size:13px;padding:4px 0;}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);
    background:var(--panel-3);border:1px solid var(--accent);color:var(--text);
    padding:11px 20px;border-radius:99px;font-size:14px;opacity:0;
    transition:.3s;pointer-events:none;z-index:99;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>AI Search Pro</h1>
    <p>ค้นหา • สรุป • สนทนาต่อเนื่อง — <kbd>Ctrl+K</kbd> ค้นหา • <kbd>Esc</kbd> หยุด</p>
  </header>

  <div class="layout">
    <!-- ============ คอลัมน์ซ้าย ============ -->
    <div>
      <section class="card">
        <h2>ตั้งค่า API</h2>
        <div class="row">
          <div>
            <label for="provider">ผู้ให้บริการ</label>
            <select id="provider">
              <option value="https://api.openai.com/v1/chat/completions">OpenAI</option>
              <option value="https://api.groq.com/openai/v1/chat/completions">Groq</option>
              <option value="https://openrouter.ai/api/v1/chat/completions">OpenRouter</option>
              <option value="custom">Custom Endpoint...</option>
            </select>
          </div>
          <div>
            <label for="model">โมเดล</label>
            <input id="model" value="gpt-4o-mini" placeholder="gpt-4o-mini" />
          </div>
        </div>
        <div class="row" style="margin-top:12px;">
          <div style="flex:3;">
            <label for="apiKey">API Key</label>
            <input id="apiKey" type="password" placeholder="sk-..." autocomplete="off" />
          </div>
          <div style="flex:0 0 auto;display:flex;align-items:flex-end;gap:8px;">
            <button id="saveKey">บันทึก</button>
            <button id="testBtn" class="ghost">ทดสอบ</button>
            <button id="clearKey" class="ghost">ล้าง</button>
          </div>
        </div>
        <div id="customBox" style="display:none;margin-top:12px;">
          <label for="customUrl">Custom Endpoint URL</label>
          <input id="customUrl" placeholder="https://your-api.com/v1/chat/completions" />
        </div>

        <details style="margin-top:14px;">
          <summary>⚙️ ตั้งค่าขั้นสูง</summary>
          <div class="row" style="margin-top:12px;">
            <div>
              <label>สไตล์คำตอบ</label>
              <select id="style">
                <option value="short">กระชับ</option>
                <option value="balanced" selected>สมดุล</option>
                <option value="detail">ละเอียด</option>
              </select>
            </div>
            <div>
              <label>Max tokens</label>
              <input id="maxTok" type="number" value="2000" min="100" max="16000" step="100" />
            </div>
            <div>
              <label>Temperature: <span id="tempVal">0.4</span></label>
              <input id="temp" type="range" min="0" max="2" step="0.1" value="0.4" style="margin-top:10px;" />
            </div>
          </div>
        </details>
        <div id="status"></div>
      </section>

      <section class="card">
        <h2>ค้นหา
          <label class="toggle"><input type="checkbox" id="ctxMode" /> สนทนาต่อเนื่อง</label>
        </h2>
        <div class="search-bar">
          <input id="query" placeholder="พิมพ์สิ่งที่อยากค้นหา..." />
          <button id="searchBtn">ค้นหา</button>
          <button id="stopBtn" class="ghost" style="display:none;">หยุด</button>
        </div>
        <div class="chips">
          <span class="chip">อธิบาย JavaScript Promise แบบเข้าใจง่าย</span>
          <span class="chip">เปรียบเทียบ SQL กับ NoSQL เป็นตาราง</span>
          <span class="chip">สรุปแนวคิด Machine Learning ใน 5 ข้อ</span>
        </div>
      </section>

      <section class="card">
        <h2>ผลลัพธ์
          <span style="display:flex;gap:6px;">
            <button class="ghost sm" id="copyBtn">คัดลอก</button>
            <button class="ghost sm" id="dlBtn">ดาวน์โหลด .md</button>
          </span>
        </h2>
        <div id="result"></div>
        <div class="meta" id="meta" style="display:none;">
          <span id="mTime"></span><span id="mChar"></span><span id="mModel"></span>
        </div>
      </section>
    </div>

    <!-- ============ คอลัมน์ขวา ============ -->
    <aside>
      <section class="card">
        <h2>ประวัติ <button class="ghost sm" id="clearHist">ล้างทั้งหมด</button></h2>
        <div id="histList"></div>
      </section>
    </aside>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ================= 1) Element refs ================= */
const $=id=>document.getElementById(id);
const providerEl=$("provider"),modelEl=$("model"),keyEl=$("apiKey");
const customBox=$("customBox"),customUrl=$("customUrl");
const queryEl=$("query"),searchBtn=$("searchBtn"),stopBtn=$("stopBtn");
const resultEl=$("result"),statusEl=$("status"),histList=$("histList");
const tempEl=$("temp"),tempVal=$("tempVal"),maxTok=$("maxTok"),styleEl=$("style"),ctxMode=$("ctxMode");
let controller=null, rawText="", history=[], convo=[];

/* ================= 2) Init ================= */
window.addEventListener("load",()=>{
  keyEl.value      = localStorage.getItem("ai_key")||"";
  modelEl.value    = localStorage.getItem("ai_model")||"gpt-4o-mini";
  providerEl.value = localStorage.getItem("ai_provider")||providerEl.value;
  customUrl.value  = localStorage.getItem("ai_custom")||"";
  history = JSON.parse(localStorage.getItem("ai_hist")||"[]");
  toggleCustom(); renderHist();
  if(keyEl.value) setStatus("พบ API Key ที่บันทึกไว้ พร้อมใช้งาน","ok");
});
providerEl.addEventListener("change",toggleCustom);
function toggleCustom(){customBox.style.display=providerEl.value==="custom"?"block":"none";}
tempEl.addEventListener("input",()=>tempVal.textContent=tempEl.value);

/* ================= 3) Key management ================= */
$("saveKey").onclick=()=>{
  if(!keyEl.value.trim())return setStatus("กรุณากรอก API Key ก่อน","err");
  localStorage.setItem("ai_key",keyEl.value.trim());
  localStorage.setItem("ai_model",modelEl.value.trim());
  localStorage.setItem("ai_provider",providerEl.value);
  localStorage.setItem("ai_custom",customUrl.value.trim());
  setStatus("บันทึกเรียบร้อย ✓","ok"); toast("บันทึกการตั้งค่าแล้ว");
};
$("clearKey").onclick=()=>{
  if(!confirm("ล้าง API Key และการตั้งค่าทั้งหมด?"))return;
  ["ai_key","ai_model","ai_provider","ai_custom"].forEach(k=>localStorage.removeItem(k));
  keyEl.value=""; setStatus("ล้างข้อมูลแล้ว","");
};

/* ================= 4) Test connection ================= */
$("testBtn").onclick=async()=>{
  const cfg=getCfg(); if(!cfg)return;
  setStatus('<span class="dot"></span>กำลังทดสอบการเชื่อมต่อ...');
  try{
    const r=await fetch(cfg.url,{method:"POST",
      headers:{"Content-Type":"application/json","Authorization":"Bearer "+cfg.key},
      body:JSON.stringify({model:cfg.model,max_tokens:5,
        messages:[{role:"user",content:"hi"}]})});
    if(!r.ok) throw new Error("HTTP "+r.status+" — "+(await r.text()).slice(0,200));
    setStatus("เชื่อมต่อสำเร็จ ✓ โมเดล "+cfg.model+" พร้อมใช้งาน","ok");
  }catch(e){ setStatus("เชื่อมต่อไม่สำเร็จ: "+e.message,"err"); }
};

/* ================= 5) Search ================= */
document.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{queryEl.value=c.textContent;runSearch();});
searchBtn.onclick=runSearch;
queryEl.onkeydown=e=>{if(e.key==="Enter")runSearch();};
stopBtn.onclick=()=>controller&&controller.abort();
document.addEventListener("keydown",e=>{
  if((e.ctrlKey||e.metaKey)&&e.key==="k"){e.preventDefault();queryEl.focus();queryEl.select();}
  if(e.key==="Escape"&&controller)controller.abort();
});

function getCfg(){
  const key=keyEl.value.trim();
  const url=providerEl.value==="custom"?customUrl.value.trim():providerEl.value;
  if(!key){setStatus("กรุณาใส่ API Key ก่อน","err");return null;}
  if(!url){setStatus("กรุณาระบุ Endpoint URL","err");return null;}
  return {key,url,model:modelEl.value.trim()||"gpt-4o-mini"};
}

const STYLES={
  short:"ตอบสั้น กระชับ ตรงประเด็น ไม่เกิน 5 บรรทัด",
  balanced:"ตอบอย่างสมดุล มีโครงสร้างชัดเจน แยกหัวข้อเมื่อเหมาะสม",
  detail:"ตอบละเอียด ครอบคลุม พร้อมตัวอย่างประกอบและข้อควรระวัง"
};

async function runSearch(){
  const cfg=getCfg(); if(!cfg)return;
  const q=queryEl.value.trim();
  if(!q)return setStatus("กรุณาพิมพ์คำค้นหา","err");

  if(!ctxMode.checked) convo=[];
  convo.push({role:"user",content:q});

  rawText=""; resultEl.innerHTML=""; $("meta").style.display="none";
  setLoading(true); setStatus('<span class="dot"></span>กำลังค้นหา...');
  const t0=performance.now();
  controller=new AbortController();

  try{
    const res=await fetch(cfg.url,{method:"POST",signal:controller.signal,
      headers:{"Content-Type":"application/json","Authorization":"Bearer "+cfg.key},
      body:JSON.stringify({
        model:cfg.model, stream:true,
        temperature:parseFloat(tempEl.value),
        max_tokens:parseInt(maxTok.value)||2000,
        messages:[
          {role:"system",content:"คุณคือผู้ช่วยค้นหาข้อมูล ตอบเป็นภาษาไทยด้วย Markdown. "+STYLES[styleEl.value]},
          ...convo.slice(-10)
        ]
      })});
    if(!res.ok) throw new Error("HTTP "+res.status+" — "+(await res.text()).slice(0,300));

    const reader=res.body.getReader(), dec=new TextDecoder();
    let buf="";
    while(true){
      const {done,value}=await reader.read(); if(done)break;
      buf+=dec.decode(value,{stream:true});
      const lines=buf.split("\n"); buf=lines.pop();
      for(const l of lines){
        const t=l.trim(); if(!t.startsWith("data:"))continue;
        const d=t.slice(5).trim(); if(d==="[DONE]")continue;
        try{
          const delta=JSON.parse(d).choices?.[0]?.delta?.content;
          if(delta){ rawText+=delta; resultEl.innerHTML=md(rawText); }
        }catch(_){}
      }
    }
    convo.push({role:"assistant",content:rawText});
    addCopyBtns();
    const secs=((performance.now()-t0)/1000).toFixed(1);
    $("mTime").textContent="⏱ "+secs+" วินาที";
    $("mChar").textContent="📝 "+rawText.length.toLocaleString()+" อักษร";
    $("mModel").textContent="🤖 "+cfg.model;
    $("meta").style.display="flex";
    setStatus("เสร็จสิ้น ✓","ok");
    saveHist(q,rawText);
  }catch(err){
    if(err.name==="AbortError")setStatus("ยกเลิกการค้นหาแล้ว","");
    else setStatus("เกิดข้อผิดพลาด: "+err.message,"err");
  }finally{ setLoading(false); controller=null; }
}

/* ================= 6) Mini Markdown parser ================= */
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function md(src){
  const blocks=[];
  let s=src.replace(/```(\w*)\n?([\s\S]*?)```/g,(m,lang,code)=>{
    blocks.push('<pre><code class="'+lang+'">'+esc(code.replace(/\n$/,""))+'</code></pre>');
    return "\u0000B"+(blocks.length-1)+"\u0000";
  });
  s=esc(s);
  // ตาราง
  s=s.replace(/^\|(.+)\|\n\|[-:\s|]+\|\n((?:\|.*\|\n?)*)/gm,(m,head,body)=>{
    const th=head.split("|").map(c=>"<th>"+c.trim()+"</th>").join("");
    const tr=body.trim().split("\n").map(r=>
      "<tr>"+r.replace(/^\||\|$/g,"").split("|").map(c=>"<td>"+c.trim()+"</td>").join("")+"</tr>").join("");
    return "<table><thead><tr>"+th+"</tr></thead><tbody>"+tr+"</tbody></table>";
  });
  s=s.replace(/^### (.*)$/gm,"<h3>$1</h3>")
     .replace(/^## (.*)$/gm,"<h2>$1</h2>")
     .replace(/^# (.*)$/gm,"<h1>$1</h1>")
     .replace(/^&gt; (.*)$/gm,"<blockquote>$1</blockquote>")
     .replace(/^(---|\*\*\*)$/gm,"<hr>")
     .replace(/`([^`\n]+)`/g,"<code>$1</code>")
     .replace(/\*\*([^*\n]+)\*\*/g,"<strong>$1</strong>")
     .replace(/(?<!\*)\*([^*\n]+)\*(?!\*)/g,"<em>$1</em>")
     .replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')
     .replace(/^\s*[-*+] (.*)$/gm,"<li>$1</li>")
     .replace(/^\s*\d+\. (.*)$/gm,"<li>$1</li>")
     .replace(/(<li>[\s\S]*?<\/li>)(?!\s*<li>)/g,"<ul>$1</ul>");
  s=s.split(/\n{2,}/).map(p=>{
    const t=p.trim(); if(!t)return"";
    return /^<(h[123]|ul|ol|pre|table|blockquote|hr|\u0000)/.test(t)?t:"<p>"+t.replace(/\n/g,"<br>")+"</p>";
  }).join("");
  return s.replace(/\u0000B(\d+)\u0000/g,(m,i)=>blocks[i]);
}
function addCopyBtns(){
  resultEl.querySelectorAll("pre").forEach(pre=>{
    if(pre.querySelector(".copy"))return;
    const b=document.createElement("button");
    b.className="copy"; b.textContent="คัดลอก";
    b.onclick=()=>{navigator.clipboard.writeText(pre.querySelector("code").textContent);
      b.textContent="คัดลอกแล้ว ✓"; setTimeout(()=>b.textContent="คัดลอก",1500);};
    pre.appendChild(b);
  });
}

/* ================= 7) History ================= */
function saveHist(q,a){
  history.unshift({q,a,t:Date.now()});
  history=history.slice(0,40);
  localStorage.setItem("ai_hist",JSON.stringify(history));
  renderHist();
}
function renderHist(){
  if(!history.length){histList.innerHTML='<div class="empty">ยังไม่มีประวัติการค้นหา</div>';return;}
  histList.innerHTML=history.map((h,i)=>
    '<div class="hist-item" data-i="'+i+'"><div>'+
    '<div class="hist-q">'+esc(h.q)+'</div>'+
    '<div class="hist-t">'+new Date(h.t).toLocaleString("th-TH")+'</div></div>'+
    '<button class="hist-del" data-d="'+i+'">×</button></div>').join("");
  histList.querySelectorAll(".hist-item").forEach(el=>el.onclick=e=>{
    if(e.target.dataset.d!==undefined)return;
    const h=history[el.dataset.i];
    queryEl.value=h.q; rawText=h.a; resultEl.innerHTML=md(h.a); addCopyBtns();
    setStatus("แสดงผลจากประวัติ","ok"); $("meta").style.display="none";
    window.scrollTo({top:0,behavior:"smooth"});
  });
  histList.querySelectorAll(".hist-del").forEach(b=>b.onclick=e=>{
    e.stopPropagation(); history.splice(b.dataset.d,1);
    localStorage.setItem("ai_hist",JSON.stringify(history)); renderHist();
  });
}
$("clearHist").onclick=()=>{
  if(!history.length||!confirm("ล้างประวัติทั้งหมด?"))return;
  history=[]; localStorage.removeItem("ai_hist"); renderHist(); toast("ล้างประวัติแล้ว");
};

/* ================= 8) Copy / Download ================= */
$("copyBtn").onclick=()=>{
  if(!rawText)return toast("ยังไม่มีผลลัพธ์");
  navigator.clipboard.writeText(rawText); toast("คัดลอกผลลัพธ์แล้ว ✓");
};
$("dlBtn").onclick=()=>{
  if(!rawText)return toast("ยังไม่มีผลลัพธ์");
  const blob=new Blob(["# "+queryEl.value+"\n\n"+rawText],{type:"text/markdown"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="ai-search-"+Date.now()+".md"; a.click();
  URL.revokeObjectURL(a.href); toast("ดาวน์โหลดแล้ว ✓");
};

/* ================= 9) Helpers ================= */
function setLoading(on){
  searchBtn.disabled=on;
  searchBtn.textContent=on?"กำลังค้นหา...":"ค้นหา";
  stopBtn.style.display=on?"inline-block":"none";
}
function setStatus(msg,cls){statusEl.innerHTML=msg;statusEl.className=cls||"";}
let tid;
function toast(msg){
  const t=$("toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(tid); tid=setTimeout(()=>t.classList.remove("show"),2200);
}
</script>
</body>
</html>
