<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<title>API Key Manager</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #262b36;
    --text: #e6e8ee;
    --muted: #8a93a6;
    --accent: #7c5cff;
    --accent-2: #22d3ee;
    --danger: #ef4444;
    --ok: #22c55e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Inter", "Segoe UI", system-ui, sans-serif;
    background: radial-gradient(1200px 600px at 20% -10%, #1b1f2e 0%, transparent 60%),
                radial-gradient(900px 500px at 110% 10%, #13202b 0%, transparent 60%),
                var(--bg);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 520px;
    background: linear-gradient(180deg, var(--panel), #12151c);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 28px;
    box-shadow: 0 20px 60px rgba(0,0,0,.45);
  }
  h1 {
    margin: 0 0 6px;
    font-size: 22px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  p.sub { margin: 0 0 22px; color: var(--muted); font-size: 14px; }
  label { display:block; font-size: 13px; color: var(--muted); margin-bottom: 8px; }
  .field {
    display: flex;
    gap: 8px;
    background: #0c0f14;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 6px 6px 6px 14px;
    transition: border-color .2s;
  }
  .field:focus-within { border-color: var(--accent); }
  .field input {
    flex: 1;
    background: transparent;
    border: 0;
    outline: none;
    color: var(--text);
    font-size: 15px;
    padding: 10px 0;
    font-family: "JetBrains Mono", monospace;
  }
  button {
    background: linear-gradient(135deg, var(--accent), #5b8cff);
    color: white;
    border: 0;
    padding: 10px 18px;
    border-radius: 10px;
    font-weight: 600;
    cursor: pointer;
    transition: transform .1s, opacity .2s;
  }
  button:hover { transform: translateY(-1px); }
  button:disabled { opacity: .5; cursor: not-allowed; transform: none; }
  .row { display:flex; gap:10px; margin-top: 14px; }
  .ghost {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
  }
  .status {
    margin-top: 18px;
    font-size: 13px;
    color: var(--muted);
    min-height: 20px;
  }
  .status.ok { color: var(--ok); }
  .status.err { color: var(--danger); }
  .hint {
    margin-top: 22px;
    font-size: 12px;
    color: var(--muted);
    background: #0c0f14;
    border: 1px dashed var(--border);
    border-radius: 10px;
    padding: 12px;
    line-height: 1.6;
  }
  code { color: var(--accent-2); }
</style>
</head>
<body>
  <div class="card">
    <h1>🔐 API Key Manager</h1>
    <p class="sub">เก็บ API Key ไว้ใน Firebase Firestore (ไม่อยู่ในโค้ดฝั่ง client)</p>

    <label for="keyInput">API Key</label>
    <div class="field">
      <input id="keyInput" type="password" placeholder="sk-xxxxxxxxxxxxxxxxxxxx" autocomplete="off" />
      <button id="saveBtn">Save</button>
    </div>

    <div class="row">
      <button id="loadBtn" class="ghost">Load from Firebase</button>
      <button id="toggleBtn" class="ghost">Show / Hide</button>
    </div>

    <div id="status" class="status"></div>

    <div class="hint">
      วิธีใช้: <br>
      1) สร้างโปรเจกต์ Firebase → เปิด Firestore → สร้าง collection ชื่อ <code>config</code> → document <code>settings</code><br>
      2) เติม <code>firebaseConfig</code> ด้านล่างในโค้ด<br>
      3) กด <b>Save</b> เพื่อเก็บ key, กด <b>Load</b> เพื่อดึงกลับมาใช้
    </div>
  </div>

<!-- Firebase SDK -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getFirestore, doc, setDoc, getDoc
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  // ⬇️ เติมค่าจาก Firebase Console ของคุณ
  const firebaseConfig = {
    apiKey: "YOUR_FIREBASE_API_KEY",
    authDomain: "YOUR_PROJECT.firebaseapp.com",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_PROJECT_ID.appspot.com",
    messagingSenderId: "xxxx",
    appId: "xxxx"
  };

  const app = initializeApp(firebaseConfig);
  const db  = getFirestore(app);

  const COLLECTION = "config";
  const DOC_ID     = "settings";
  const FIELD      = "myApiKey";   // ชื่อ field ที่เก็บ API key

  const $ = (id) => document.getElementById(id);
  const status = (msg, type = "") => {
    const el = $("status");
    el.textContent = msg;
    el.className = "status " + type;
  };

  // บันทึก API Key ลง Firestore
  $("saveBtn").addEventListener("click", async () => {
    const val = $("keyInput").value.trim();
    if (!val) return status("กรุณาใส่ API Key", "err");
    try {
      await setDoc(doc(db, COLLECTION, DOC_ID), { [FIELD]: val, updatedAt: Date.now() });
      status("✅ บันทึกสำเร็จ", "ok");
    } catch (e) {
      console.error(e);
      status("❌ บันทึกไม่สำเร็จ: " + e.message, "err");
    }
  });

  // โหลด API Key จาก Firestore
  $("loadBtn").addEventListener("click", async () => {
    try {
      const snap = await getDoc(doc(db, COLLECTION, DOC_ID));
      if (!snap.exists()) return status("⚠️ ยังไม่มีข้อมูลใน Firestore", "err");
      const key = snap.data()[FIELD];
      $("keyInput").value = key || "";
      status("✅ โหลดสำเร็จ", "ok");
    } catch (e) {
      console.error(e);
      status("❌ โหลดไม่สำเร็จ: " + e.message, "err");
    }
  });

  // Show/Hide password
  $("toggleBtn").addEventListener("click", () => {
    const i = $("keyInput");
    i.type = i.type === "password" ? "text" : "password";
  });

  // === ฟังก์ชันสำหรับเรียกใช้ API Key ในส่วนอื่นของเว็บ ===
  window.getApiKey = async () => {
    const snap = await getDoc(doc(db, COLLECTION, DOC_ID));
    return snap.exists() ? snap.data()[FIELD] : null;
  };

  // ตัวอย่างการใช้งาน:
  // const key = await getApiKey();
  // fetch("https://api.example.com/data", { headers: { Authorization: "Bearer " + key } });
</script>
</body>
</html>
