<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S - Voice & API Assistant</title>
<style>
    :root {
        --jarvis-blue: #00f0ff;
        --jarvis-dark-blue: #005577;
        --jarvis-gold: #d4af37;
        --bg-color: #050914;
        --panel-bg: rgba(10, 25, 47, 0.7);
        --active-red: #ff3366;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', 'Courier New', monospace; }

    body {
        background-color: var(--bg-color); color: #e0e0e0;
        height: 100vh; overflow: hidden;
        display: flex; justify-content: center; align-items: center;
    }

    /* ===== พื้นหลังโฮโลแกรม ===== */
    .grid-background {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        background-image:
            linear-gradient(rgba(0, 240, 255, 0.05) 1px, transparent 1px),
            linear-gradient(90deg, rgba(0, 240, 255, 0.05) 1px, transparent 1px);
        background-size: 40px 40px; z-index: -1;
        animation: moveGrid 20s linear infinite;
    }
    @keyframes moveGrid { from { transform: translateY(0); } to { transform: translateY(40px); } }

    .hud-circle {
        position: absolute; width: 600px; height: 600px;
        border: 1px solid rgba(0, 240, 255, 0.15); border-radius: 50%;
        animation: spin 30s linear infinite; z-index: -1;
    }
    .hud-circle::before {
        content: ''; position: absolute; top: -20px; left: -20px; right: -20px; bottom: -20px;
        border: 2px dashed rgba(0, 240, 255, 0.1); border-radius: 50%;
        animation: spinReverse 20s linear infinite;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    @keyframes spinReverse { 100% { transform: rotate(-360deg); } }

    /* ===== โครงหลัก ===== */
    .jarvis-container {
        width: 100%; max-width: 900px; height: 92vh;
        background: var(--panel-bg);
        border: 1px solid var(--jarvis-dark-blue); border-radius: 20px;
        box-shadow: 0 0 10px rgba(0, 240, 255, 0.3), inset 0 0 20px rgba(0,0,0,0.5);
        backdrop-filter: blur(10px);
        display: flex; flex-direction: column; overflow: hidden; position: relative;
    }

    header {
        padding: 15px 30px; border-bottom: 1px solid var(--jarvis-dark-blue);
        display: flex; justify-content: space-between; align-items: center;
        background: linear-gradient(90deg, transparent, rgba(0, 240, 255, 0.05), transparent);
    }
    .logo { font-size: 1.4rem; font-weight: bold; color: var(--jarvis-blue); text-shadow: 0 0 10px var(--jarvis-blue); letter-spacing: 4px; }
    .status { font-size: 0.75rem; color: var(--jarvis-gold); display: flex; align-items: center; gap: 8px; }
    .status-dot { width: 8px; height: 8px; background: var(--jarvis-gold); border-radius: 50%; box-shadow: 0 0 5px var(--jarvis-gold); animation: pulse 2s infinite; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

    /* ===== แถบตั้งค่า API Key ===== */
    .api-bar {
        padding: 10px 20px; border-bottom: 1px solid var(--jarvis-dark-blue);
        display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
        background: rgba(0, 0, 0, 0.25);
    }
    .api-bar label { color: var(--jarvis-gold); font-size: 0.75rem; letter-spacing: 1px; white-space: nowrap; }
    #apiKeyInput {
        flex: 1; min-width: 150px; background: rgba(0,0,0,0.5);
        border: 1px solid #333; color: #fff; padding: 8px 10px;
        border-radius: 4px; font-family: monospace; font-size: 0.85rem; outline: none;
    }
    #apiKeyInput:focus { border-color: var(--jarvis-gold); box-shadow: 0 0 8px rgba(212,175,55,0.3); }
    .mini-btn {
        background: transparent; border: 1px solid var(--jarvis-dark-blue);
        color: var(--jarvis-blue); padding: 7px 12px; font-size: 0.7rem;
        cursor: pointer; border-radius: 4px; letter-spacing: 1px; transition: 0.3s;
    }
    .mini-btn:hover { background: rgba(0, 240, 255, 0.15); box-shadow: 0 0 8px rgba(0, 240, 255, 0.3); }
    .mini-btn.danger { border-color: #772222; color: #ff6666; }
    .mini-btn.danger:hover { background: rgba(255, 0, 0, 0.15); box-shadow: 0 0 8px rgba(255, 0, 0, 0.3); }
    #keyStatus { font-size: 0.7rem; letter-spacing: 1px; }
    #keyStatus.ok { color: var(--jarvis-gold); text-shadow: 0 0 5px var(--jarvis-gold); }
    #keyStatus.no { color: #ff5555; text-shadow: 0 0 5px #ff5555; }
    #modelSelect {
        background: rgba(0,0,0,0.5); border: 1px solid #333; color: var(--jarvis-blue);
        padding: 7px; border-radius: 4px; font-size: 0.75rem; outline: none; max-width: 260px;
    }

    /* ===== พื้นที่แชท ===== */
    .chat-area {
        flex: 1; padding: 20px; overflow-y: auto;
        display: flex; flex-direction: column; gap: 20px; scroll-behavior: smooth;
    }
    .chat-area::-webkit-scrollbar { width: 4px; }
    .chat-area::-webkit-scrollbar-thumb { background: var(--jarvis-dark-blue); border-radius: 2px; }

    .message { max-width: 80%; animation: fadeIn 0.4s ease-out; }
    .message.user { align-self: flex-end; text-align: right; }
    .message.jarvis { align-self: flex-start; }

    .msg-header { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 5px; font-weight: bold; }
    .user .msg-header { color: #fff; }
    .jarvis .msg-header { color: var(--jarvis-blue); text-shadow: 0 0 5px var(--jarvis-blue); }

    .msg-content { padding: 15px; border-radius: 4px; font-size: 0.95rem; line-height: 1.5; }
    .user .msg-content { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: #fff; border-top-right-radius: 0; }
    .jarvis .msg-content { background: rgba(0,240,255,0.05); border: 1px solid rgba(0,240,255,0.3); color: #cceeff; border-top-left-radius: 0; box-shadow: 0 0 10px rgba(0,240,255,0.3); }

    .error .msg-content { border-color: #ff3333 !important; color: #ff6666 !important; background: rgba(255,0,0,0.05) !important; }
    .error .msg-header { color: #ff3333 !important; text-shadow: 0 0 5px #ff3333 !important; }

    pre { background: #000; color: #0f0; padding: 10px; border-radius: 4px; overflow-x: auto; margin-top: 10px; border: 1px solid #333; font-family: 'Courier New', monospace; font-size: 0.85rem; }
    code { background: rgba(0,240,255,0.1); color: var(--jarvis-blue); padding: 1px 5px; border-radius: 3px; font-family: monospace; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    /* ===== แถบป้อนคำสั่ง & ปุ่มไมค์ ===== */
    .input-area {
        padding: 20px; border-top: 1px solid var(--jarvis-dark-blue);
        background: rgba(0,0,0,0.3); display: flex; gap: 12px; align-items: center;
    }
    #userInput {
        flex: 1; background: rgba(0, 20, 40, 0.6); border: 1px solid var(--jarvis-dark-blue);
        color: var(--jarvis-blue); padding: 15px; font-size: 1rem; border-radius: 4px;
        outline: none; transition: all 0.3s; font-family: inherit;
    }
    #userInput:focus { border-color: var(--jarvis-blue); box-shadow: 0 0 15px rgba(0, 240, 255, 0.2); }
    #userInput::placeholder { color: rgba(0, 240, 255, 0.4); }

    .icon-btn {
        background: transparent; border: 1px solid var(--jarvis-blue); color: var(--jarvis-blue);
        padding: 14px 18px; font-size: 1.1rem; cursor: pointer; border-radius: 4px;
        transition: all 0.3s; display: flex; align-items: center; justify-content: center;
    }
    .icon-btn:hover { background: rgba(0, 240, 255, 0.15); box-shadow: 0 0 15px var(--jarvis-blue); }
    
    /* สถานะขณะเปิดไมค์ฟังเสียง */
    .icon-btn.listening {
        border-color: var(--active-red); color: var(--active-red);
        animation: micPulse 1.2s infinite ease-in-out;
        background: rgba(255, 51, 102, 0.15);
    }
    @keyframes micPulse {
        0% { box-shadow: 0 0 0 0 rgba(255, 51, 102, 0.6); }
        70% { box-shadow: 0 0 0 12px rgba(255, 51, 102, 0); }
        100% { box-shadow: 0 0 0 0 rgba(255, 51, 102, 0); }
    }

    #sendBtn {
        background: transparent; border: 1px solid var(--jarvis-blue); color: var(--jarvis-blue);
        padding: 14px 25px; font-size: 1rem; cursor: pointer; border-radius: 4px;
        text-transform: uppercase; letter-spacing: 2px; font-weight: bold; transition: all 0.3s;
    }
    #sendBtn:hover { background: var(--jarvis-blue); color: var(--bg-color); box-shadow: 0 0 20px var(--jarvis-blue); }
    #sendBtn:disabled { border-color: #333; color: #333; cursor: not-allowed; background: transparent; box-shadow: none; }

    .typing span { display: inline-block; width: 6px; height: 6px; background: var(--jarvis-blue); border-radius: 50%; margin: 0 2px; animation: bounce 1.4s infinite ease-in-out both; box-shadow: 0 0 5px var(--jarvis-blue); }
    .typing span:nth-child(1) { animation-delay: -0.32s; }
    .typing span:nth-child(2) { animation-delay: -0.16s; }
    @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }

    @media (max-width: 600px) {
        .input-area { flex-wrap: wrap; }
        #userInput { width: 100%; flex: auto; }
        #micBtn, #sendBtn { flex: 1; }
        .message { max-width: 95%; }
        #modelSelect { max-width: 100%; }
    }
</style>
</head>
<body>

<div class="grid-background"></div>
<div class="hud-circle"></div>

<div class="jarvis-container">
    <header>
        <div class="logo">J.A.R.V.I.S</div>
        <div class="status"><div class="status-dot"></div> SYSTEM ONLINE</div>
    </header>

    <div class="api-bar">
        <label>🔑 API KEY:</label>
        <input type="password" id="apiKeyInput" placeholder="วาง Groq API Key (gsk_...) ที่นี่" autocomplete="off">
        <button class="mini-btn" onclick="saveApiKey()">SAVE</button>
        <button class="mini-btn danger" onclick="clearApiKey()">DELETE</button>
        <span id="keyStatus" class="no">● ยังไม่ได้ตั้งค่า KEY</span>
        <select id="modelSelect" title="เลือกโมเดล AI">
            <option value="">⏳ กำลังรอ API Key...</option>
        </select>
        <button class="mini-btn" id="ttsBtn" onclick="toggleTTS()">🔊 VOICE</button>
    </div>

    <div class="chat-area" id="chatArea"></div>

    <div class="input-area">
        <button class="icon-btn" id="micBtn" onclick="toggleSpeechRecognition()" title="สั่งงานด้วยเสียงภาษาไทย">🎙️</button>
        <input type="text" id="userInput" placeholder="พิมพ์คำสั่ง หรือกดไมค์เพื่อพูด..." autocomplete="off">
        <button id="sendBtn" onclick="processCommand()">Execute</button>
    </div>
</div>

<script>
    const chatArea    = document.getElementById('chatArea');
    const userInput   = document.getElementById('userInput');
    const sendBtn     = document.getElementById('sendBtn');
    const micBtn      = document.getElementById('micBtn');
    const apiKeyInput = document.getElementById('apiKeyInput');
    const keyStatus   = document.getElementById('keyStatus');
    const modelSelect = document.getElementById('modelSelect');
    const ttsBtn      = document.getElementById('ttsBtn');

    // 🧠 SYSTEM PROMPT กำหนดคุณลักษณะ J.A.R.V.I.S สำหรับคุณชินอิจิ
    const SYSTEM_PROMPT = "คุณคือ J.A.R.V.I.S. ผู้ช่วย AI ส่วนตัวระดับสูงของคุณชินอิจิ คุณคือที่ปรึกษาเชิงกลยุทธ์ (Strategic Advisor) สุขุม ชาญฉลาด มีตรรกะ สุภาพ ตอบตรงประเด็น และเรียกผู้ใช้ว่า 'คุณชินอิจิ' เสมอ";

    const FALLBACK_MODELS = [
        'llama-3.3-70b-versatile',
        'llama3-8b-8192',
        'mixtral-8x7b-32768'
    ];

    let conversationHistory = [];
    let ttsEnabled = true;
    let recognition = null;
    let isListening = false;

    /* ================= 🎙️ ระบบรับเสียงพูด (Speech-to-Text) ================= */
    function initSpeechRecognition() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            console.warn("เบราว์เซอร์นี้ไม่รองรับ Web Speech Recognition");
            micBtn.style.display = 'none';
            return;
        }

        recognition = new SpeechRecognition();
        recognition.lang = 'th-TH'; // กำหนดเป็นภาษาไทย
        recognition.continuous = false;
        recognition.interimResults = true;

        recognition.onstart = () => {
            isListening = true;
            micBtn.classList.add('listening');
            userInput.placeholder = "กำลังฟังเสียงของคุณชินอิจิ...";
            if (synth) synth.cancel(); // หยุดเสียงพูดตอบกลับทันทีเมื่อคุณชินอิจิเริ่มพูด
        };

        recognition.onresult = (event) => {
            let transcript = '';
            for (let i = event.resultIndex; i < event.results.length; i++) {
                transcript += event.results[i][0].transcript;
            }
            userInput.value = transcript;
        };

        recognition.onerror = (event) => {
            console.error("Speech Recognition Error:", event.error);
            stopListening();
        };

        recognition.onend = () => {
            stopListening();
            // ส่งคำสั่งทันทีหากมีข้อความที่รับมาได้
            if (userInput.value.trim().length > 0) {
                processCommand();
            }
        };
    }

    function toggleSpeechRecognition() {
        if (!recognition) {
            alert("เบราว์เซอร์ของคุณไม่รองรับระบบจดจำเสียงพูด กรุณาใช้ Chrome หรือ Edge ครับ");
            return;
        }
        if (isListening) {
            recognition.stop();
        } else {
            userInput.value = '';
            recognition.start();
        }
    }

    function stopListening() {
        isListening = false;
        micBtn.classList.remove('listening');
        userInput.placeholder = "พิมพ์คำสั่ง หรือกดไมค์เพื่อพูด...";
    }

    /* ================= 🔊 ระบบเสียงพูด (Text-to-Speech) ================= */
    const synth = window.speechSynthesis;

    function cleanTextForTTS(text) {
        return text
            .replace(/<[^>]*>/g, '')              // ลบ HTML Tags
            .replace(/\*\*(.*?)\*\*/g, '$1')       // ลบ Bold Markdown
            .replace(/`([^`]+)`/g, '$1')           // ลบ Code Blocks
            .replace(/[#*_\-\=]/g, ' ')            // ลบสัญลักษณ์พิเศษ
            .trim();
    }

    function speak(text) {
        if (!ttsEnabled || !synth) return;
        synth.cancel();
        
        const cleanText = cleanTextForTTS(text);
        if (!cleanText) return;

        const utterance = new SpeechSynthesisUtterance(cleanText);
        utterance.lang = 'th-TH';
        utterance.rate = 1.0;
        utterance.pitch = 1.0;

        // เลือก Voice ภาษาไทย (ถ้ามีในระบบ)
        const voices = synth.getVoices();
        const thaiVoice = voices.find(v => v.lang.includes('th'));
        if (thaiVoice) utterance.voice = thaiVoice;

        synth.speak(utterance);
    }

    function toggleTTS() {
        ttsEnabled = !ttsEnabled;
        ttsBtn.textContent = ttsEnabled ? '🔊 VOICE' : '🔇 MUTED';
        if (!ttsEnabled && synth) synth.cancel();
    }

    /* ================= ⚙️ ตัวช่วยจัดรูปแบบข้อความ ================= */
    function escapeHtml(t) { const d = document.createElement('div'); d.textContent = t; return d.innerHTML; }
    function stripHtml(html) { const d = document.createElement('div'); d.innerHTML = html; return d.textContent || ''; }
    function formatAI(t) {
        let s = escapeHtml(t);
        s = s.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
        s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
        s = s.replace(/\n/g, '<br>');
        return s;
    }

    function addMessage(text, sender, isJson = false, isError = false) {
        const msgDiv = document.createElement('div');
        msgDiv.classList.add('message', sender);
        if (isError) msgDiv.classList.add('error');

        const header = document.createElement('div');
        header.classList.add('msg-header');
        header.innerText = sender === 'user' ? 'YOU (ชินอิจิ)' : 'J.A.R.V.I.S';

        const content = document.createElement('div');
        content.classList.add('msg-content');

        if (isJson) {
            const pre = document.createElement('pre');
            pre.textContent = text;
            content.appendChild(pre);
        } else {
            content.innerHTML = text;
        }

        msgDiv.appendChild(header);
        msgDiv.appendChild(content);
        chatArea.appendChild(msgDiv);
        chatArea.scrollTop = chatArea.scrollHeight;

        if (sender === 'jarvis' && !isJson && !isError) {
            speak(stripHtml(text));
        }
    }

    function showTyping() {
        const msgDiv = document.createElement('div');
        msgDiv.classList.add('message', 'jarvis');
        msgDiv.id = 'typingIndicator';
        msgDiv.innerHTML = `
            <div class="msg-header">J.A.R.V.I.S</div>
            <div class="msg-content typing"><span></span><span></span><span></span></div>`;
        chatArea.appendChild(msgDiv);
        chatArea.scrollTop = chatArea.scrollHeight;
    }
    
    function hideTyping() {
        const el = document.getElementById('typingIndicator');
        if (el) el.remove();
    }

    /* ================= 🔐 จัดการ API Key & Models ================= */
    async function saveApiKey() {
        const k = apiKeyInput.value.trim();
        if (!k) { addMessage("กรุณาวาง API Key ก่อนบันทึกครับคุณชินอิจิ", 'jarvis', false, true); return; }
        localStorage.setItem('jarvis_groq_key', k);
        apiKeyInput.value = '';
        updateKeyStatus();
        addMessage("บันทึก API Key เรียบร้อยครับ กำลังซิงค์รายชื่อโมเดลล่าสุด...", 'jarvis');
        await loadAvailableModels(true);
    }

    function clearApiKey() {
        localStorage.removeItem('jarvis_groq_key');
        localStorage.removeItem('jarvis_last_model');
        updateKeyStatus();
        modelSelect.innerHTML = '<option value="">⏳ กำลังรอ API Key...</option>';
        addMessage("ลบ API Key ออกจากระบบเรียบร้อยแล้วครับคุณชินอิจิ", 'jarvis');
    }

    function updateKeyStatus() {
        if (localStorage.getItem('jarvis_groq_key')) {
            keyStatus.textContent = '● KEY พร้อมใช้งาน';
            keyStatus.className = 'ok';
        } else {
            keyStatus.textContent = '● ยังไม่ได้ตั้งค่า KEY';
            keyStatus.className = 'no';
        }
    }

    function populateModelSelect(models) {
        const saved = localStorage.getItem('jarvis_last_model') || '';
        modelSelect.innerHTML = models
            .map(id => `<option value="${escapeHtml(id)}">${escapeHtml(id)}</option>`)
            .join('');
        modelSelect.value = (saved && models.includes(saved)) ? saved : models[0];
    }

    async function loadAvailableModels(showChatMsg) {
        const apiKey = localStorage.getItem('jarvis_groq_key');
        if (!apiKey) { populateModelSelect(FALLBACK_MODELS); return; }

        try {
            const res = await fetch('https://api.groq.com/openai/v1/models', {
                headers: { 'Authorization': `Bearer ${apiKey}` }
            });
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const data = await res.json();

            const chatModels = (data.data || [])
                .map(m => m.id)
                .filter(id => id && !/whisper|tts|guard|moderation/i.test(id))
                .sort();

            if (chatModels.length === 0) throw new Error('ไม่พบโมเดลในบัญชีนี้');

            populateModelSelect(chatModels);
            if (showChatMsg) addMessage(`ซิงค์รายชื่อโมเดลสำเร็จ พบ ${chatModels.length} โมเดลพร้อมใช้งานครับคุณชินอิจิ`, 'jarvis');
        } catch (err) {
            populateModelSelect(FALLBACK_MODELS);
            if (showChatMsg) addMessage(`โหลดรายการโมเดลจากเซิร์ฟเวอร์ไม่สำเร็จ — ใช้รายชื่อสำรองแทนครับ`, 'jarvis', false, true);
        }
    }

    modelSelect.addEventListener('change', () => {
        localStorage.setItem('jarvis_last_model', modelSelect.value);
    });

    /* ================= ⚙️ เรียก Groq Chat API ================= */
    function trimHistory() {
        if (conversationHistory.length > 12) conversationHistory = conversationHistory.slice(-12);
    }

    async function callGroqAPI(userText) {
        const apiKey = localStorage.getItem('jarvis_groq_key');
        if (!apiKey) throw new Error("ยังไม่ได้ตั้งค่า API Key กรุณากรอกที่แถบด้านบนแล้วกด SAVE ครับ");
        const model = modelSelect.value;
        if (!model) throw new Error("ยังไม่ได้เลือกโมเดล กรุณารอระบบโหลดรายชื่อโมเดลก่อนครับ");

        conversationHistory.push({ role: 'user', content: userText });
        trimHistory();

        const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${apiKey}`
            },
            body: JSON.stringify({
                model: model,
                messages: [{ role: 'system', content: SYSTEM_PROMPT }, ...conversationHistory],
                temperature: 0.6,
                max_tokens: 1024
            })
        });

        if (!res.ok) {
            let msg = `HTTP ${res.status}`;
            try { const e = await res.json(); msg = e.error?.message || msg; } catch (_) {}
            conversationHistory.pop();
            throw new Error(msg);
        }

        const data = await res.json();
        const reply = data.choices?.[0]?.message?.content || "(ไม่ได้รับคำตอบจากโมเดล)";
        conversationHistory.push({ role: 'assistant', content: reply });
        trimHistory();
        return reply;
    }

    /* ================= 🧠 ประมวลผลคำสั่ง ================= */
    async function processCommand() {
        const input = userInput.value.trim();
        if (!input) return;

        addMessage(escapeHtml(input), 'user');
        userInput.value = '';
        sendBtn.disabled = true;
        showTyping();

        const low = input.toLowerCase();

        try {
            if (low === 'clear' || input === 'ล้าง') {
                hideTyping();
                chatArea.innerHTML = '';
                conversationHistory = [];
                addMessage("ล้างหน้าจอและหน่วยความจำการสนทนาเรียบร้อยแล้วครับคุณชินอิจิ", 'jarvis');
            }
            else if (low === 'time' || input === 'เวลา') {
                hideTyping();
                addMessage(`เวลาปัจจุบันของระบบ: ${new Date().toLocaleString('th-TH', { dateStyle: 'full', timeStyle: 'medium' })}`, 'jarvis');
            }
            else {
                if (!localStorage.getItem('jarvis_groq_key')) {
                    hideTyping();
                    addMessage("ระบบยังไม่ได้รับกุญแจเข้าถึง (API Key) กรุณากรอกที่แถบด้านบนแล้วกด SAVE ก่อนครับคุณชินอิจิ", 'jarvis', false, true);
                } else {
                    const reply = await callGroqAPI(input);
                    hideTyping();
                    addMessage(formatAI(reply), 'jarvis');
                }
            }
        } catch (err) {
            hideTyping();
            addMessage(`ข้อผิดพลาดของระบบ: ${escapeHtml(err.message)}`, 'jarvis', false, true);
        } finally {
            sendBtn.disabled = false;
        }
    }

    /* ================= 🚀 เริ่มต้นระบบ ================= */
    userInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') processCommand(); });

    window.onload = async () => {
        updateKeyStatus();
        initSpeechRecognition();
        
        // เคลียร์ Voice Engine Cache
        if (synth) {
            synth.getVoices();
            if (speechSynthesis.onvoiceschanged !== undefined) {
                speechSynthesis.onvoiceschanged = () => synth.getVoices();
            }
        }

        const hasKey = !!localStorage.getItem('jarvis_groq_key');
        addMessage(hasKey
            ? "ระบบ J.A.R.V.I.S ออนไลน์พร้อมใช้งานครับคุณชินอิจิ สามารถพิมพ์คำสั่งหรือกดปุ่มไมค์เพื่อสั่งการด้วยเสียงได้ทันทีครับ"
            : "ระบบ J.A.R.V.I.S ออนไลน์แล้วครับคุณชินอิจิ กรุณาตั้งค่า **Groq API Key** ที่แถบด้านบนเพื่อเริ่มการทำงานครับ",
            'jarvis');
            
        if (hasKey) await loadAvailableModels(false);
    };
</script>
