<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Search — Dark Theme</title>
<style>
  :root{
    --bg:#0b0d12;
    --panel:#141821;
    --panel-2:#1b202b;
    --border:#262c3a;
    --text:#e6e9f0;
    --muted:#8b93a7;
    --accent:#6d8cff;
    --accent-2:#38d39f;
    --danger:#ff6b6b;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(900px 500px at 15% -10%, #1a2340 0%, transparent 60%),
      radial-gradient(800px 500px at 90% 0%, #14322b 0%, transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:"Segoe UI", "Noto Sans Thai", system-ui, -apple-system, sans-serif;
    padding:32px 16px 60px;
  }
  .wrap{max-width:900px;margin:0 auto;}
  header{text-align:center;margin-bottom:28px;}
  header h1{
    margin:0 0 6px;
    font-size:30px;
    background:linear-gradient(90deg,var(--accent),var(--accent-2));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  header p{margin:0;color:var(--muted);font-size:14px;}
  .card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:18px;
    margin-bottom:18px;
    box-shadow:0 10px 30px rgba(0,0,0,.35);
  }
  .card h2{margin:0 0 14px;font-size:14px;color:var(--muted);letter-spacing:.5px;text-transform:uppercase;}
  .row{display:flex;gap:10px;flex-wrap:wrap;}
  .row > *{flex:1;min-width:150px;}
  label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;}
  input, select, textarea{
    width:100%;
    padding:12px 14px;
    background:var(--panel-2);
    border:1px solid var(--border);
    border-radius:10px;
    color:var(--text);
    font-size:15px;
    font-family:inherit;
    outline:none;
    transition:border-color .2s, box-shadow .2s;
  }
  input:focus, select:focus, textarea:focus{
    border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(109,140,255,.18);
  }
  button{
    padding:12px 20px;
    border:none;
    border-radius:10px;
    background:linear-gradient(135deg,var(--accent),#8a6dff);
    color:#fff;
    font-size:15px;
    font-weight:600;
    font-family:inherit;
    cursor:pointer;
    transition:transform .12s, opacity .2s;
    white-space:nowrap;
  }
  button:hover{transform:translateY(-1px);}
  button:disabled{opacity:.5;cursor:not-allowed;transform:none;}
  button.ghost{background:var(--panel-2);border:1px solid var(--border);color:var(--muted);}
  .search-bar{display:flex;gap:10px;}
  .search-bar input{flex:1;padding:15px 18px;font-size:16px;}
  .search-bar button{flex:0 0 auto;}
  #status{font-size:13px;color:var(--muted);min-height:20px;margin-top:10px;}
  #status.err{color:var(--danger);}
  #status.ok{color:var(--accent-2);}
  #result{
    white-space:pre-wrap;
    line-height:1.75;
    font-size:15px;
    min-height:60px;
    color:var(--text);
  }
  #result:empty::before{content:"ผลลัพธ์จะแสดงที่นี่...";color:var(--muted);}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
  .chip{
    padding:7px 13px;
    background:var(--panel-2);
    border:1px solid var(--border);
    border-radius:999px;
    font-size:13px;
    color:var(--muted);
    cursor:pointer;
    transition:.2s;
  }
  .chip:hover{border-color:var(--accent);color:var(--text);}
  .dot{
    display:inline-block;width:8px;height:8px;border-radius:50%;
    background:var(--accent-2);margin-right:7px;
    animation:pulse 1s infinite;
  }
  @keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>AI Search</h1>
    <p>ค้นหาและสรุปข้อมูลด้วยโมเดล AI — ใส่ API Key ของคุณเพื่อเริ่มใช้งาน</p>
  </header>

  <!-- ===== ส่วนตั้งค่า API ===== -->
  <section class="card">
    <h2>ตั้งค่า API</h2>
    <div class="row">
      <div>
        <label for="provider">ผู้ให้บริการ</label>
        <select id="provider">
          <option value="gemini">Google Gemini</option>
          <option value="https://api.openai.com/v1/chat/completions">OpenAI</option>
          <option value="https://api.groq.com/openai/v1/chat/completions">Groq</option>
          <option value="https://openrouter.ai/api/v1/chat/completions">OpenRouter</option>
          <option value="custom">Custom Endpoint...</option>
        </select>
      </div>
      <div>
        <label for="model">โมเดล</label>
        <input id="model" placeholder="gemini-2.5-flash" value="gemini-2.5-flash" />
      </div>
    </div>

    <div class="row" style="margin-top:12px;">
      <div style="flex:3;">
        <label for="apiKey">API Key</label>
        <input id="apiKey" type="password" placeholder="AIzaSy... / sk-..." autocomplete="off" />
      </div>
      <div style="flex:0 0 auto;display:flex;align-items:flex-end;gap:8px;">
        <button id="saveKey">บันทึก Key</button>
        <button id="clearKey" class="ghost">ล้าง</button>
      </div>
    </div>

    <div id="customBox" style="display:none;margin-top:12px;">
      <label for="customUrl">Custom Endpoint URL</label>
      <input id="customUrl" placeholder="https://your-api.com/v1/chat/completions" />
    </div>

    <div id="status"></div>
  </section>

  <!-- ===== ช่องค้นหา ===== -->
  <section class="card">
    <h2>ค้นหา</h2>
    <div class="search-bar">
      <input id="query" placeholder="พิมพ์สิ่งที่อยากค้นหา เช่น สรุปหลักการทำงานของ HTTP/3" />
      <button id="searchBtn">ค้นหา</button>
      <button id="stopBtn" class="ghost" style="display:none;">หยุด</button>
    </div>
    <div class="chips">
      <span class="chip">อธิบาย JavaScript Promise แบบเข้าใจง่าย</span>
      <span class="chip">เปรียบเทียบ SQL กับ NoSQL</span>
      <span class="chip">สรุปแนวคิด Machine Learning ใน 5 ข้อ</span>
    </div>
  </section>

  <!-- ===== ผลลัพธ์ ===== -->
  <section class="card">
    <h2>ผลลัพธ์</h2>
    <div id="result"></div>
  </section>

</div>

<script>
/* ---------- 1) อ้างอิง element ---------- */
const $ = (id) => document.getElementById(id);
const providerEl = $("provider"), modelEl = $("model"), keyEl = $("apiKey");
const customBox = $("customBox"), customUrl = $("customUrl");
const queryEl = $("query"), searchBtn = $("searchBtn"), stopBtn = $("stopBtn");
const resultEl = $("result"), statusEl = $("status");
let controller = null;

/* ---------- 2) โหลดค่าที่เคยบันทึกไว้ ---------- */
window.addEventListener("load", () => {
  keyEl.value      = localStorage.getItem("ai_key")      || "";
  providerEl.value = localStorage.getItem("ai_provider") || "gemini";
  modelEl.value    = localStorage.getItem("ai_model")    || (providerEl.value === "gemini" ? "gemini-2.5-flash" : "gpt-4o-mini");
  customUrl.value  = localStorage.getItem("ai_custom")   || "";
  toggleCustom();
  if (keyEl.value) setStatus("พบ API Key ที่บันทึกไว้ พร้อมใช้งาน", "ok");
});

/* ---------- 3) จัดการ เปลี่ยน Provider / Custom Endpoint ---------- */
providerEl.addEventListener("change", () => {
  toggleCustom();
  // สลับค่า Default Model อัตโนมัติเพื่อความสะดวกของผู้ใช้
  if (providerEl.value === "gemini") {
    modelEl.value = "gemini-2.5-flash";
  } else if (providerEl.value.includes("openai.com")) {
    modelEl.value = "gpt-4o-mini";
  }
});

function toggleCustom(){
  customBox.style.display = providerEl.value === "custom" ? "block" : "none";
}

/* ---------- 4) บันทึก / ล้าง API Key ---------- */
$("saveKey").addEventListener("click", () => {
  if (!keyEl.value.trim()) return setStatus("กรุณากรอก API Key ก่อน", "err");
  localStorage.setItem("ai_key", keyEl.value.trim());
  localStorage.setItem("ai_model", modelEl.value.trim());
  localStorage.setItem("ai_provider", providerEl.value);
  localStorage.setItem("ai_custom", customUrl.value.trim());
  setStatus("บันทึกเรียบร้อย ✓", "ok");
});

$("clearKey").addEventListener("click", () => {
  localStorage.clear();
  keyEl.value = "";
  setStatus("ล้างข้อมูลทั้งหมดแล้ว", "");
});

/* ---------- 5) ตัวอย่างคำค้น (chips) ---------- */
document.querySelectorAll(".chip").forEach(c => {
  c.addEventListener("click", () => { queryEl.value = c.textContent; runSearch(); });
});

/* ---------- 6) ผูก event ค้นหา ---------- */
searchBtn.addEventListener("click", runSearch);
queryEl.addEventListener("keydown", e => { if (e.key === "Enter") runSearch(); });
stopBtn.addEventListener("click", () => controller && controller.abort());

/* ---------- 7) ฟังก์ชันหลัก: เรียก API แบบ streaming ---------- */
async function runSearch(){
  const key      = keyEl.value.trim();
  const q        = queryEl.value.trim();
  const provider = providerEl.value;
  const model    = modelEl.value.trim() || (provider === "gemini" ? "gemini-2.5-flash" : "gpt-4o-mini");

  if (!key) return setStatus("กรุณาใส่ API Key ก่อนค้นหา", "err");
  if (!q)   return setStatus("กรุณาพิมพ์คำค้นหา", "err");

  resultEl.textContent = "";
  setLoading(true);
  setStatus('<span class="dot"></span>กำลังค้นหา...', "");

  controller = new AbortController();

  try{
    let fetchUrl = "";
    let fetchHeaders = { "Content-Type": "application/json" };
    let fetchBody = {};

    const systemPrompt = "คุณคือผู้ช่วยค้นหาข้อมูล ตอบเป็นภาษาไทยอย่างกระชับ ถูกต้อง มีโครงสร้างชัดเจน และแยกเป็นหัวข้อเมื่อเหมาะสม";

    // แยกการประกอบ Request ตามประเภทของ Provider (Gemini VS OpenAI Format)
    if (provider === "gemini") {
      fetchUrl = `https://generativelanguage.googleapis.com/v1beta/models/${model}:streamGenerateContent?alt=sse&key=${key}`;
      fetchBody = {
        systemInstruction: { parts: [{ text: systemPrompt }] },
        contents: [{ role: "user", parts: [{ text: q }] }],
        generationConfig: { temperature: 0.4 }
      };
    } else {
      fetchUrl = provider === "custom" ? customUrl.value.trim() : provider;
      if (!fetchUrl) throw new Error("กรุณาระบุ Endpoint URL");
      
      fetchHeaders["Authorization"] = "Bearer " + key;
      fetchBody = {
        model: model,
        stream: true,
        temperature: 0.4,
        messages: [
          { role: "system", content: systemPrompt },
          { role: "user", content: q }
        ]
      };
    }

    const res = await fetch(fetchUrl, {
      method: "POST",
      signal: controller.signal,
      headers: fetchHeaders,
      body: JSON.stringify(fetchBody)
    });

    if (!res.ok){
      const errText = await res.text();
      throw new Error("HTTP " + res.status + " — " + errText.slice(0, 300));
    }

    // อ่านข้อมูลแบบ stream (Server-Sent Events)
    const reader  = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";

    while (true){
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split("\n");
      buffer = lines.pop();

      for (const line of lines){
        const t = line.trim();
        if (!t.startsWith("data:")) continue;
        const data = t.slice(5).trim();
        if (data === "[DONE]") continue;

        try{
          const json = JSON.parse(data);
          let textChunk = "";

          // Parse Delta Text ตามโครงสร้าง JSON ของแต่ละ Provider
          if (provider === "gemini") {
            textChunk = json.candidates?.[0]?.content?.parts?.[0]?.text || "";
          } else {
            textChunk = json.choices?.[0]?.delta?.content || "";
          }

          if (textChunk){
            resultEl.textContent += textChunk;
            window.scrollTo(0, document.body.scrollHeight);
          }
        }catch(_){ /* ข้าม chunk ที่ยังไม่สมบูรณ์ */ }
      }
    }
    setStatus("เสร็จสิ้น ✓", "ok");

  }catch(err){
    if (err.name === "AbortError") setStatus("ยกเลิกการค้นหาแล้ว", "");
    else setStatus("เกิดข้อผิดพลาด: " + err.message, "err");
  }finally{
    setLoading(false);
    controller = null;
  }
}

/* ---------- 8) ฟังก์ชันช่วยเหลือ ---------- */
function setLoading(on){
  searchBtn.disabled = on;
  searchBtn.textContent = on ? "กำลังค้นหา..." : "ค้นหา";
  stopBtn.style.display = on ? "inline-block" : "none";
}
function setStatus(msg, cls){
  statusEl.innerHTML = msg;
  statusEl.className = cls || "";
}
</script>
</body>
  </html>
