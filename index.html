<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S - Personal API Assistant</title>
    <style>
        :root {
            --jarvis-blue: #00f0ff;
            --jarvis-dark-blue: #005577;
            --jarvis-gold: #d4af37;
            --bg-color: #050914;
            --panel-bg: rgba(10, 25, 47, 0.7);
            --border-glow: 0 0 10px rgba(0, 240, 255, 0.3);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', 'Courier New', monospace; }

        body {
            background-color: var(--bg-color);
            color: #e0e0e0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* พื้นหลังตารางโฮโลแกรม */
        .grid-background {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(0, 240, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: -1;
            animation: moveGrid 20s linear infinite;
        }
        @keyframes moveGrid { from { transform: translateY(0); } to { transform: translateY(40px); } }

        /* วงแหวนโฮโลแกรมหมุนด้านหลัง */
        .hud-circle {
            position: absolute; width: 600px; height: 600px;
            border: 1px solid rgba(0, 240, 255, 0.15); border-radius: 50%;
            animation: spin 30s linear infinite; z-index: -1;
        }
        .hud-circle::before {
            content: ''; position: absolute; top: -20px; left: -20px; right: -20px; bottom: -20px;
            border: 2px dashed rgba(0, 240, 255, 0.1); border-radius: 50%;
            animation: spinReverse 20s linear infinite;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes spinReverse { 100% { transform: rotate(-360deg); } }

        /* คอนเทนเนอร์หลัก */
        .jarvis-container {
            width: 100%; max-width: 900px; height: 90vh;
            background: var(--panel-bg);
            border: 1px solid var(--jarvis-dark-blue);
            border-radius: 20px;
            box-shadow: var(--border-glow), inset 0 0 20px rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
            display: flex; flex-direction: column;
            overflow: hidden; position: relative;
        }

        /* ส่วนหัว */
        header {
            padding: 20px 30px;
            border-bottom: 1px solid var(--jarvis-dark-blue);
            display: flex; justify-content: space-between; align-items: center;
            background: linear-gradient(90deg, transparent, rgba(0, 240, 255, 0.05), transparent);
        }
        .logo {
            font-size: 1.5rem; font-weight: bold; color: var(--jarvis-blue);
            text-shadow: 0 0 10px var(--jarvis-blue); letter-spacing: 4px;
        }
        .status { font-size: 0.8rem; color: var(--jarvis-gold); display: flex; align-items: center; gap: 8px; }
        .status-dot { width: 8px; height: 8px; background: var(--jarvis-gold); border-radius: 50%; box-shadow: 0 0 5px var(--jarvis-gold); animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

        /* พื้นที่แชท */
        .chat-area {
            flex: 1; padding: 20px; overflow-y: auto;
            display: flex; flex-direction: column; gap: 20px;
            scroll-behavior: smooth;
        }
        .chat-area::-webkit-scrollbar { width: 4px; }
        .chat-area::-webkit-scrollbar-thumb { background: var(--jarvis-dark-blue); border-radius: 2px; }

        .message { max-width: 80%; animation: fadeIn 0.4s ease-out; }
        .message.user { align-self: flex-end; text-align: right; }
        .message.jarvis { align-self: flex-start; }

        .msg-header { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 5px; font-weight: bold; }
        .user .msg-header { color: #fff; }
        .jarvis .msg-header { color: var(--jarvis-blue); text-shadow: 0 0 5px var(--jarvis-blue); }

        .msg-content {
            padding: 15px; border-radius: 4px; font-size: 0.95rem; line-height: 1.5;
        }
        .user .msg-content { background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255,255,255,0.2); color: #fff; border-top-right-radius: 0; }
        .jarvis .msg-content { background: rgba(0, 240, 255, 0.05); border: 1px solid rgba(0, 240, 255, 0.3); color: #cceeff; border-top-left-radius: 0; box-shadow: var(--border-glow); }
        
        .error .msg-content { border-color: #ff3333 !important; color: #ff6666 !important; background: rgba(255,0,0,0.05) !important; }
        .error .msg-header { color: #ff3333 !important; text-shadow: 0 0 5px #ff3333 !important; }

        pre { background: #000; color: #0f0; padding: 10px; border-radius: 4px; overflow-x: auto; margin-top: 10px; border: 1px solid #333; font-family: 'Courier New', monospace; font-size: 0.85rem; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* แถบป้อนคำสั่ง */
        .input-area {
            padding: 20px; border-top: 1px solid var(--jarvis-dark-blue);
            background: rgba(0, 0, 0, 0.3); display: flex; gap: 15px; align-items: center;
        }
        input[type="text"] {
            flex: 1; background: rgba(0, 20, 40, 0.6); border: 1px solid var(--jarvis-dark-blue);
            color: var(--jarvis-blue); padding: 15px; font-size: 1rem; border-radius: 4px;
            outline: none; transition: all 0.3s; font-family: inherit;
        }
        input[type="text"]:focus { border-color: var(--jarvis-blue); box-shadow: 0 0 15px rgba(0, 240, 255, 0.2); }
        input[type="text"]::placeholder { color: rgba(0, 240, 255, 0.4); }

        button {
            background: transparent; border: 1px solid var(--jarvis-blue); color: var(--jarvis-blue);
            padding: 14px 25px; font-size: 1rem; cursor: pointer; border-radius: 4px;
            text-transform: uppercase; letter-spacing: 2px; font-weight: bold; transition: all 0.3s;
        }
        button:hover { background: var(--jarvis-blue); color: var(--bg-color); box-shadow: 0 0 20px var(--jarvis-blue); }
        button:disabled { border-color: #333; color: #333; cursor: not-allowed; background: transparent; box-shadow: none; }

        /* Typing Indicator */
        .typing span { display: inline-block; width: 6px; height: 6px; background: var(--jarvis-blue); border-radius: 50%; margin: 0 2px; animation: bounce 1.4s infinite ease-in-out both; box-shadow: 0 0 5px var(--jarvis-blue); }
        .typing span:nth-child(1) { animation-delay: -0.32s; } .typing span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
    </style>
</head>
<body>

<div class="grid-background"></div>
<div class="hud-circle"></div>

<div class="jarvis-container">
    <header>
        <div class="logo">J.A.R.V.I.S</div>
        <div class="status"><div class="status-dot"></div> SYSTEM ONLINE</div>
    </header>

    <div class="chat-area" id="chatArea">
        <!-- ข้อความต้อนรับเริ่มต้น -->
    </div>

    <div class="input-area">
        <input type="text" id="userInput" placeholder="พิมพ์คำสั่ง หรือ URL API ที่ต้องการทดสอบ..." autocomplete="off">
        <button id="sendBtn" onclick="processCommand()">Execute</button>
    </div>
</div>

<script>
    const chatArea = document.getElementById('chatArea');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');

    // ระบบเสียงจำลอง (Text-to-Speech) ถ้าเบราว์เซอร์รองรับ
    const synth = window.speechSynthesis;
    function speak(text) {
        if (synth) {
            synth.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'th-TH'; // ภาษาไทย
            utterance.rate = 1.0;
            utterance.pitch = 0.9; // เสียงทุ้มนิดๆ แบบหุ่นยนต์
            synth.speak(utterance);
        }
    }

    function addMessage(text, sender, isJson = false, isError = false) {
        const msgDiv = document.createElement('div');
        msgDiv.classList.add('message', sender);
        if (isError) msgDiv.classList.add('error');

        const header = document.createElement('div');
        header.classList.add('msg-header');
        header.innerText = sender === 'user' ? 'YOU' : 'J.A.R.V.I.S';

        const content = document.createElement('div');
        content.classList.add('msg-content');

        if (isJson) {
            const pre = document.createElement('pre');
            pre.textContent = text;
            content.appendChild(pre);
        } else {
            content.innerHTML = text;
        }

        msgDiv.appendChild(header);
        msgDiv.appendChild(content);
        chatArea.appendChild(msgDiv);
        chatArea.scrollTop = chatArea.scrollHeight;
        
        // พูดตอบกลับเฉพาะของ Jarvis
        if (sender === 'jarvis' && !isJson) speak(text.replace(/<[^>]*>?/gm, ''));
    }

    function showTyping() {
        const msgDiv = document.createElement('div');
        msgDiv.classList.add('message', 'jarvis');
        msgDiv.id = 'typingIndicator';
        msgDiv.innerHTML = `
            <div class="msg-header">J.A.R.V.I.S</div>
            <div class="msg-content typing"><span></span><span></span><span></span></div>
        `;
        chatArea.appendChild(msgDiv);
        chatArea.scrollTop = chatArea.scrollHeight;
    }

    function hideTyping() {
        const el = document.getElementById('typingIndicator');
        if (el) el.remove();
    }

    // ==========================================
    // ⚙️ ส่วนจัดการ API (ใส่ API ของคุณตรงนี้)
    // ==========================================
    async function callAPI(url, method = 'GET') {
        // ตรงนี้คุณสามารถเพิ่ม Headers, Token หรือ Body ของคุณเองได้
        const options = {
            method: method,
            headers: { 'Content-Type': 'application/json' }
        };

        const response = await fetch(url, options);
        const contentType = response.headers.get("content-type");
        
        if (contentType && contentType.includes("application/json")) {
            return await response.json();
        } else {
            return await response.text();
        }
    }

    // ==========================================
    // 🧠 สมองกลประมวลผลคำสั่ง (Command Parser)
    // ==========================================
    async function processCommand() {
        const input = userInput.value.trim();
        if (!input) return;

        addMessage(input, 'user');
        userInput.value = '';
        sendBtn.disabled = true;
        showTyping();

        // จำลองการคิด 1 วินาที
        await new Promise(r => setTimeout(r, 800));
        hideTyping();

        try {
            // 1. ตรวจสอบว่าเป็น URL หรือไม่ (สำหรับทดสอบ API)
            if (input.startsWith('http://') || input.startsWith('https://')) {
                addMessage(`กำลังเข้าถึงเซิร์ฟเวอร์ปลายทาง: <br><code>${input}</code>`, 'jarvis');
                showTyping();
                
                const startTime = performance.now();
                const data = await callAPI(input);
                const endTime = performance.now();
                const duration = ((endTime - startTime) / 1000).toFixed(2);
                
                hideTyping();
                
                let responseText = typeof data === 'object' ? JSON.stringify(data, null, 2) : data;
                addMessage(`ดึงข้อมูลสำเร็จ ใช้เวลา ${duration} วินาที`, 'jarvis');
                addMessage(responseText, 'jarvis', true);

            } 
            // 2. คำสั่งพื้นฐาน (Custom Commands)
            else if (input.toLowerCase() === 'help' || input === 'ช่วยเหลือ') {
                addMessage(`คำสั่งที่รองรับ:<br>
                    1. พิมพ์ <b>URL</b> เพื่อทดสอบ API<br>
                    2. พิมพ์ <b>time</b> เพื่อดูเวลาปัจจุบัน<br>
                    3. พิมพ์ <b>clear</b> เพื่อล้างหน้าจอ<br>
                    4. พิมพ์คำสั่งอื่นๆ ได้ตามที่คุณจะเขียนโค้ดเพิ่ม`, 'jarvis');
            }
            else if (input.toLowerCase() === 'time' || input === 'เวลา') {
                const now = new Date().toLocaleString('th-TH');
                addMessage(`เวลาปัจจุบันของระบบคือ: ${now}`, 'jarvis');
            }
            else if (input.toLowerCase() === 'clear' || input === 'ล้าง') {
                chatArea.innerHTML = '';
                addMessage("ล้างข้อมูลในระบบเรียบร้อยแล้ว", 'jarvis');
            }
            // 3. ใส่ Logic เชื่อม API ของคุณเพิ่มเติมตรงนี้
            else if (input.toLowerCase().includes('สวัสดี')) {
                addMessage("สวัสดีครับท่าน พร้อมรับคำสั่งเสมอ", 'jarvis');
            }
            else {
                // Default: ถ้าไม่เข้าเงื่อนไขไหน ให้ส่งข้อความไปหา API AI ของคุณ (ถ้ามี)
                addMessage(`ไม่พบคำสั่ง "${input}" ในฐานข้อมูล กรุณาพิมพ์ "help" เพื่อดูคำสั่งที่รองรับ หรือกรอก URL API โดยตรง`, 'jarvis', false, true);
            }

        } catch (error) {
            hideTyping();
            addMessage(`เกิดข้อผิดพลาดในการเชื่อมต่อระบบ: ${error.message}`, 'jarvis', false, true);
        } finally {
            sendBtn.disabled = false;
            userInput.focus();
        }
    }

    // รองรับการกด Enter
    userInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') processCommand();
    });

    // เริ่มต้นระบบเมื่อโหลดหน้าเสร็จ
    window.onload = () => {
        addMessage("ระบบ J.A.R.V.I.S ออนไลน์แล้ว... ยินดีต้อนรับครับท่าน<br>พิมพ์ <b>help</b> เพื่อดูคำสั่ง หรือวาง <b>URL API</b> เพื่อเริ่มทดสอบ", 'jarvis');
        userInput.focus();
    };
</script>

</body>
</html>
